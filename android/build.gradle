buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 35
        compileSdkVersion = 37
        targetSdkVersion = 35
        ndkVersion = "30.0.16248370"
        kotlinVersion = "2.4.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP is versioned explicitly here: React Native's catalog pins
        // 9.2.1 (node_modules/@react-native/gradle-plugin/gradle/
        // libs.versions.toml, and RN main still pins 9.2.1 as of Nov 2026),
        // so the unversioned classpath would resolve to 9.2.1. AGP 9.5.1
        // needs Gradle >= 9.6.0 — the wrapper is 9.9.1. The RN gradle
        // plugin (0.88.1) uses the stable AGP variant API plus one internal
        // task-factory helper (dependsOn); AGP 9.5.0's notes list no removed
        // or renamed DSL entries, but only the CI Android build proves the
        // plugin runs against 9.5.1. Revert to the unversioned classpath if
        // a future RN ships a newer AGP.
        classpath("com.android.tools.build:gradle:9.5.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Pin to ext.kotlinVersion (2.4.21). Left unversioned, this resolves to
        // RN's catalog default (2.2.0) via react-native-gradle-plugin, while the
        // stdlib follows ext.kotlinVersion — so modules compile with Kotlin 2.2.0
        // against a 2.4.21 stdlib and fail with "compiled with an incompatible
        // version of Kotlin ... metadata version is 2.4.0, but the compiler
        // version 2.2.0 can read versions up to 2.3.0". Keep in sync with
        // kotlinVersion above (Firebase BoM 35 requires KGP >= 2.4.0).
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21")

        // KSP (Kotlin Symbol Processing) for Room. Replaces kapt, which
        // Room 2.8.5's processor cannot run under Kotlin 2.4.21: kapt fails
        // silently (empty KaptExecutionWorkAction error, no processor output)
        // because Room's compiler-processing was built against Kotlin 2.2.0
        // and cannot read Kotlin 2.4.0 metadata. KSP reads symbols through
        // the compiler itself, so it is version-matched to Kotlin 2.4.21.
        // KSP now versions independently of Kotlin (the old 2.4.21-1.0.28
        // scheme is legacy); 2.3.14 is the latest per kotlinlang.org and
        // supports KGP 2.3.20-2.4.x. Keep in sync with kotlinVersion above.
        classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.14")

        // Add the Google Services plugin dependency
        // This is used exclusively for sending benchmarks (with user consent) to Hugging Face Spaces via Firebase.
        // Firebase is used for App Check functionality, allowing unauthenticated users to submit their benchmark data securely.
        classpath 'com.google.gms:google-services:4.6.0'
    }
}

apply plugin: "com.facebook.react.rootproject"

def onnxruntimeVersion = {
    def packageJson = file("$rootDir/../node_modules/onnxruntime-react-native/package.json")
    if (!packageJson.canRead()) {
        throw new GradleException("Cannot read ${packageJson}; run yarn install")
    }
    def version = new groovy.json.JsonSlurper().parse(packageJson).version
    if (!version) {
        throw new GradleException("No version in ${packageJson}")
    }
    return version
}()

allprojects {
    configurations.all {
        resolutionStrategy {
            // onnxruntime-react-native floats this at latest.integration; ship the AAR it was released with.
            force "com.microsoft.onnxruntime:onnxruntime-android:${onnxruntimeVersion}"
        }
    }
}
